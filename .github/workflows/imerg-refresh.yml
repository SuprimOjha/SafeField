name: Refresh GPM IMERG Late cache

on:
  workflow_dispatch:
    inputs:
      days:
        description: Number of recent daily granules to install
        required: false
        default: "7"
  schedule:
    - cron: "25 2 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Earthdata credentials
        id: credentials
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          if [[ -n "$EARTHDATA_USERNAME" && -n "$EARTHDATA_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Earthdata secrets are not configured; skipping scheduled cache refresh."
          fi
      - name: Refresh IMERG and prune old data
        if: steps.credentials.outputs.configured == 'true'
        working-directory: backend
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          IMERG_RETENTION_DAYS: "30"
          API_CACHE_RETENTION_DAYS: "30"
          SIGNAL_RETENTION_DAYS: "120"
          # Optional: with these secrets the cache and files are written to
          # Supabase, so the runner's temporary disk is not the only copy.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: safefield-data
        run: python -m app.cli refresh-data --days ${{ github.event.inputs.days || '7' }}
      - uses: actions/upload-artifact@v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          name: safefield-imerg-sqlite-cache
          path: |
            backend/app/cache/safefield_cache.db
            backend/data/automation-status.json
          if-no-files-found: error
          retention-days: 7
