name: Refresh and publish the long-timeline data branch

# Supabase Storage only keeps the live window (SUPABASE_RECENT_DAYS, default 3).
# This workflow is the durable archive: it refreshes NASA snapshots, keeps a
# long local retention window, and publishes every signal day to the ``data``
# branch so the full timeline lives in git instead of the free-tier bucket.

on:
  workflow_dispatch:
    inputs:
      max_bytes:
        description: Maximum total working-tree bytes allowed on the data branch
        required: false
        default: "524288000"
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: write

concurrency:
  group: safefield-data-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Prepare data branch worktree
        run: |
          git config user.name "safefield-data-bot"
          git config user.email "safefield-data-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git worktree add ../data-branch origin/data -B data
          else
            echo "Data branch does not exist yet; creating an orphan branch."
            git worktree add --detach ../data-branch
            cd ../data-branch
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Restore published data before refreshing
        # publish_data mirrors the working tree, so restoring the branch first
        # keeps the existing long timeline and only appends newly verified days.
        run: |
          mkdir -p backend/data/signals
          if [ -d ../data-branch/signals ]; then
            cp -R ../data-branch/signals/. backend/data/signals/
          fi
          if [ -f ../data-branch/status.json ]; then
            cp ../data-branch/status.json backend/data/status.json
          fi

      - name: Check Earthdata credentials
        id: credentials
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          if [[ -n "$EARTHDATA_TOKEN" || ( -n "$EARTHDATA_USERNAME" && -n "$EARTHDATA_PASSWORD" ) ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Earthdata secrets are not configured; publishing the existing branch data only."
          fi

      - name: Refresh NASA snapshots and IMERG
        if: steps.credentials.outputs.configured == 'true'
        working-directory: backend
        # A partial result (for example one product still inside its NASA
        # latency window) is reported in the log, but verified data is still
        # published below.
        continue-on-error: true
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          # Long timeline on the data branch; Supabase Storage is capped
          # separately by SUPABASE_RECENT_DAYS and is not used by this job.
          SIGNAL_RETENTION_DAYS: "180"
          IMERG_RETENTION_DAYS: "7"
          API_CACHE_RETENTION_DAYS: "7"
        run: python -m app.cli refresh-data --days 7

      - name: Show installed data status
        working-directory: backend
        run: python -m app.cli status --json

      - name: Mirror snapshots and status.json
        working-directory: backend
        run: python -m app.cli publish-data --data-dir ../data-branch --max-bytes ${{ github.event.inputs.max_bytes || '524288000' }}

      - name: Commit and push with retries
        run: |
          cd ../data-branch
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes to publish."
            exit 0
          fi
          git commit -m "data: publish validated snapshots and status.json"
          for attempt in 1 2 3; do
            if git push origin data; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; rebasing on the remote data branch."
            git fetch origin data || true
            if git rev-parse --verify origin/data >/dev/null 2>&1; then
              git rebase origin/data || git rebase --abort
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push the data branch after 3 attempts." >&2
          exit 1
